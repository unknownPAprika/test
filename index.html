<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя фотогалерея</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📸 Моя фотогалерея</h1>
        <p>Нажмите на кнопку, чтобы скачать файл</p>
    </header>

    <main class="gallery">
        <!-- ZIP-архив вместо фото 1 -->
        <div class="card">
            <div class="zip-preview">
                <span class="zip-icon">📦</span>
                <span class="zip-label">ZIP-архив</span>
            </div>
            <div class="card-info">
                <h3>Мой архив</h3>
                <a href="files/archive.rar" class="download-btn">⬇ Скачать ZIP</a>
            </div>
        </div>

        <!-- Фото 2 -->
        <div class="card">
            <img src="images/photo2.jpg" alt="Фото 2" loading="lazy">
            <div class="card-info">
                <h3>Название фото 2</h3>
                <a href="images/photo2.jpg" class="download-btn">⬇ Скачать</a>
            </div>
        </div>

        <!-- Фото 3 -->
        <div class="card">
            <img src="images/photo3.jpg" alt="Фото 3" loading="lazy">
            <div class="card-info">
                <h3>Название фото 3</h3>
                <a href="images/photo3.jpg" class="download-btn">⬇ Скачать</a>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2024 Моя фотогалерея</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
