<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя фотогалерея</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📸 Моя фотогалерея</h1>
        <p>Нажмите на кнопку, чтобы скачать фото</p>
    </header>

    <main class="gallery">
        <div class="card">
            <img src="images/photo1.jpg" alt="Фото 1" loading="lazy">
            <div class="card-info">
                <h3>Название фото 1</h3>
                <a href="images/photo1.jpg" download class="download-btn">⬇ Скачать</a>
            </div>
        </div>

        <div class="card">
            <img src="images/photo2.jpg" alt="Фото 2" loading="lazy">
            <div class="card-info">
                <h3>Название фото 2</h3>
                <a href="images/photo2.jpg" download class="download-btn">⬇ Скачать</a>
            </div>
        </div>

        <div class="card">
            <img src="images/photo3.jpg" alt="Фото 3" loading="lazy">
            <div class="card-info">
                <h3>Название фото 3</h3>
                <a href="images/photo3.jpg" download class="download-btn">⬇ Скачать</a>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2024 Моя фотогалерея</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
